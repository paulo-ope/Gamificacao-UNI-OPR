services:
  db:
    image: postgres:16-alpine
    container_name: opr-gamification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opr_gamification}
      POSTGRES_USER: ${POSTGRES_USER:-opr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opr}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opr} -d ${POSTGRES_DB:-opr_gamification}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: opr-gamification-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opr:opr@db:5432/opr_gamification}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      IXC_API_BASE_URL: ${IXC_API_BASE_URL:-}
      IXC_API_TOKEN: ${IXC_API_TOKEN:-}
      IXC_API_VERIFY_SSL: ${IXC_API_VERIFY_SSL:-true}
      IXC_SYNC_ENABLED: ${IXC_SYNC_ENABLED:-false}
      IXC_SYNC_INTERVAL_MINUTES: ${IXC_SYNC_INTERVAL_MINUTES:-20}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      - ./backend/requirements-dev.txt:/app/requirements-dev.txt

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: opr-gamification-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
