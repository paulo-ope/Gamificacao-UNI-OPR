services:
  db:
    image: postgres:16-alpine
    container_name: opr-gamification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opr_gamification}
      POSTGRES_USER: ${POSTGRES_USER:-opr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opr}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opr} -d ${POSTGRES_DB:-opr_gamification}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: opr-gamification-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://opr:opr@db:5432/opr_gamification}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      IXC_API_BASE_URL: ${IXC_API_BASE_URL:-}
      IXC_API_TOKEN: ${IXC_API_TOKEN:-}
      IXC_API_VERIFY_SSL: ${IXC_API_VERIFY_SSL:-true}
      IXC_SYNC_ENABLED: ${IXC_SYNC_ENABLED:-false}
      IXC_SYNC_INTERVAL_MINUTES: ${IXC_SYNC_INTERVAL_MINUTES:-20}
      OPA_API_BASE_URL: ${OPA_API_BASE_URL:-}
      OPA_API_TOKEN: ${OPA_API_TOKEN:-}
      OPA_API_VERIFY_SSL: ${OPA_API_VERIFY_SSL:-true}
      OPA_SYNC_ENABLED: ${OPA_SYNC_ENABLED:-false}
      OPA_SYNC_INTERVAL_MINUTES: ${OPA_SYNC_INTERVAL_MINUTES:-20}
      OPA_SYNC_LOOKBACK_DAYS: ${OPA_SYNC_LOOKBACK_DAYS:-1}
      CPK_API_BASE_URL: ${CPK_API_BASE_URL:-}
      CPK_API_KEY: ${CPK_API_KEY:-}
      # URL pública (com esquema, sem barra final) por onde este backend é alcançado de fora -
      # vazio desliga o conector MCP remoto (ver app/modules/mcp_connector). Produção:
      # https://operacao.souuni.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Sem volumes de código em produção: montar ./backend/app aqui fazia o sync do OneDrive
    # (onde o projeto mora na máquina de dev) reiniciar a API via --reload no meio do uso.
    # Para desenvolver com hot-reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: opr-gamification-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    command: node server.js
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
